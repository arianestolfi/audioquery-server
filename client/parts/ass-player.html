<div class="player" id="sound{{''+audiodata.playerid}}" ng-class="{playing : playing}">

    <span class="smalltext audiodata">
        {{seekpos | sectime | date:'mm:ss'}} | {{totalVirtualDuration | sectime | date:'mm:ss'}} | {{freesound.name}} 
    </span>

    <input type="range" min="0" value="{{seekpos}}" max="{{totalVirtualDuration}}" step="any" id="slider-{{audiodata.playerid}}" ng-model="seekpos" ng-change="setseek(seekpos)" class="seekrange"></input>

    <!-- Spectrogram Container -->
    <div id="img{{containerid}}" class="imgcontainer" style="position: relative; background: #000; overflow: visible; height: 50px;">
        <img class="smallimg" id="img{{freesound.id}}" ng-src="{{freesound.images['spectral_m']}}" 
             ng-style="{'width': imgWidthStyle}"
             style="opacity:{{soundvolume * 0.7 + 0.3}}; position: absolute; left: 0; height: 100%;" 
             ondragstart="return false;" draggable="false"/>
    </div>

    <!-- Drag Track (15px Height) -->
    <div id="{{containerid}}" class="dragcontainer" style="border-top: 1px solid red; border-bottom: 1px solid red; height: 15px; width: 100%; position: relative; background: #111;">
        <div drag-me id="{{loopstart}}" ng-mouseup="setloopstart()" class="draggable ui-widget-content smalltext loopstart"> 
            <div class="pointer"></div>
        </div>
        <div drag-me id="{{loopend}}" ng-mouseup="setloopend()" class="draggable ui-widget-content smalltext loopend">
            <div class="pointer"></div>	
        </div>
    </div>

    <!-- Controls Row -->
    <div style="margin-top: 5px;">
        <a class="removebtn fa fa-times" ng-click="removethis()"></a>
        <a class="playbtn fa fa-play" ng-click="playpause()" ng-hide="playing"></a>
        <a class="playbtn fa fa-pause" ng-click="playpause()" ng-hide="!playing"></a>
        <a class="playbtn fa fa-stop" ng-click="stop()"></a>
        <a class="loopbtn fa fa-rotate-right" ng-class="{'disabled': loop}" ng-click="loop = !loop"></a>
        
        <!-- Toggle Buttons -->
        <a id="addsilence" class="fa fa-plus addsilence" ng-show="!silenceActive" ng-click="addsilence();"></a>
        <a id="removesilence" class="fa fa-minus addsilence" ng-show="silenceActive" ng-class="{'active': silenceActive}" ng-click="removesilence();"></a>

        <a class="slidersbtn fa fa-bars">
            <div class="sliders">
                <p class="smalltext panner">
                    <input type="range" min="-1" value="{{soundpan}}" max="1" step="any" ng-model="soundpan" ng-change="setpan(soundpan)"></input> 
                    <span class="infotxt">pan: {{soundpan | number: 2}} </span> 
                </p>
                <p class="smalltext speedctr">
                    <input type="range" min="0.1" value="1" max="4" step="any" ng-model="soundspeed" ng-change="setspeed(soundspeed)"></input>
                    <span class="infotxt">speed: {{soundspeed | number: 2}} </span>  
                </p>
<p class="smalltext filterctr">
    <input type="range" min="-100" max="100" step="1" 
           ng-model="soundfilter" 
           ng-change="setfilter(soundfilter)">
    <span class="infotxt">
        <!-- If slider is 0, show Flat. Otherwise show the Type and the Hz -->
        filter: {{soundfilter == 0 ? 'Flat' :  (filterFreqDisplay | number: 0) + ' Hz'}}
    </span>
</p>
            </div>
        </a>

        <span class="smalltext volctr">
            <input type="range" min="0" value="{{soundvolume}}" max="1" step="any" ng-model="soundvolume" ng-change="setvolume(soundvolume)"></input> 
            <span class="infotxt">vol: {{soundvolume | number: 2}} </span> 
        </span>
    </div>

    <a class="fa fa-download download" href="{{freesound.url}}" target="_new"></a>
    <a class="fa fa-search search searchsimilar" ng-click="searchsimi(freesound.id);"></a>
    <div class="audioplayer" id="audio{{audiodata.playerid}}"></div>
</div>
